<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DESIGN STUDY</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FAF8F7">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="DESIGN STUDY">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login" id="login" hidden>
    <form class="login-card" id="loginForm">
      <img src="/cat.webp" alt="" class="login-cat">
      <p class="hero-sub">DESIGN SCHOOL</p>
      <h1 class="login-title">ログイン</h1>
      <p class="login-sub">Web Archive と同じアカウントでログインできます</p>
      <label class="login-field"><span>メールアドレス</span><input class="field" id="loginEmail" type="email" autocomplete="email" required></label>
      <label class="login-field"><span>パスワード</span><input class="field" id="loginPass" type="password" autocomplete="current-password" required></label>
      <p class="login-err" id="loginErr" hidden></p>
      <button class="btn primary big" id="loginBtn">ログイン</button>
    </form>
  </div>
  <main id="app" class="main" hidden></main>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
